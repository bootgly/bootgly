name: PHPStan (analyze)

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/README.md'

permissions:
  contents: read

jobs:
  # One leg per supported PHP minor, each on its own runtime. @/phpstan.neon
  # pins phpVersion to the floor (80400), so a local run on any PHP matches
  # the required leg. Each leg re-pins it to its own target, because a
  # {min: 80400, max: 80599} range does not report the newer minor's
  # deprecations.
  phpstan:
    name: phpstan (php ${{ matrix.php }}${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            target: 80400
            experimental: false
          - php: '8.5'
            target: 80500
            experimental: false

    steps:
      -
        name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      -
        name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-file: 'development'
          extensions: mbstring
      -
        name: Install dependencies with Composer
        run: composer install --prefer-dist --no-progress
      -
        name: Run PHPStan
        env:
          PHPSTAN_TARGET: ${{ matrix.target }}
        run: |
          printf 'includes:\n   - %s/@/phpstan.neon\nparameters:\n   phpVersion: %s\n' \
            "$GITHUB_WORKSPACE" "$PHPSTAN_TARGET" > "$RUNNER_TEMP/phpstan.neon"
          vendor/bin/phpstan analyze -c "$RUNNER_TEMP/phpstan.neon"
