name: Docker (build + push)

# Publishes bootgly/bootgly (slim + full) to Docker Hub on every published
# release. The Dockerfile lives at the repo root but builds with the WORKSPACE
# as context (the `full` target COPYs the sibling bootgly_benchmarks/), so this
# job checks out both repos side by side and builds from their parent.
#
# Tags follow "version is the axis, variant is the suffix" — see the tag scheme
# documented in the "Resolve version and tags" step. Pre-releases (-beta.N,
# -rc.N) publish their exact version plus a moving channel alias only; they
# never move `latest`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g. 0.17.2-beta). Required on manual dispatch.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout bootgly (framework)
        uses: actions/checkout@v5
        with:
          path: bootgly
          submodules: recursive

      - name: Checkout bootgly_benchmarks (full target needs the sibling)
        uses: actions/checkout@v5
        with:
          repository: bootgly/bootgly_benchmarks
          path: bootgly_benchmarks
          submodules: recursive

      - name: Set up PHP for canonical source provenance
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Resolve source provenance
        id: source
        run: |
          set -euo pipefail
          PROVENANCE="$(php bootgly/Bootgly/ACI/Tests/Benchmark/provenance.php bootgly bootgly_benchmarks)"
          while IFS= read -r ENTRY; do
            echo "$ENTRY" >> "$GITHUB_OUTPUT"
          done <<< "$PROVENANCE"

      - name: Resolve version and tags
        id: version
        run: |
          set -euo pipefail
          V="${{ github.event.release.tag_name || inputs.version }}"
          V="${V#v}"
          if [ -z "$V" ]; then
            echo "::error::No version resolved (provide the 'version' input on manual dispatch)."
            exit 1
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

          # ! Tag scheme: the VERSION is the primary axis, the VARIANT is a
          #   suffix. `slim` is the default variant, so it carries the bare
          #   version tag; `full` is always suffixed. This keeps the two axes
          #   from being confused the way a bare `latest` + `slim` + `full`
          #   trio does, and it makes a Bootgly version pinnable at all.
          #
          #     stable 1.2.3 → 1.2.3  1.2  1  slim
          #                    1.2.3-full  1.2-full  1-full  full
          #     pre-release  → 1.0.0-beta.1  beta
          #                    1.0.0-beta.1-full  beta-full
          #
          # ! `latest` is RETIRED and never published again. It duplicated
          #   `slim` digest-for-digest, and a redundant alias is exactly what
          #   the one-way policy forbids — plus "latest" reads as "newest",
          #   which is never what a Docker tag actually promises. The default
          #   stable variant is `slim`; say so explicitly.
          #
          # ? A pre-release must NEVER move `slim`, `full` or the major/minor
          #   aliases: `docker pull bootgly/bootgly:slim` would hand unreleased
          #   code to every user. Pre-releases publish their exact version plus
          #   a moving channel alias (`beta`, `rc`) that people opt into
          #   deliberately.
          PRERELEASE="${{ github.event.release.prerelease }}"
          case "$V" in *-*) PRERELEASE=true ;; esac

          REPO=bootgly/bootgly
          if [ "$PRERELEASE" = "true" ]; then
            CHANNEL="${V#*-}"      # 1.0.0-beta.1 → beta.1
            CHANNEL="${CHANNEL%%.*}" # beta.1      → beta
            SLIM_TAGS="$REPO:$V"$'\n'"$REPO:$CHANNEL"
            FULL_TAGS="$REPO:$V-full"$'\n'"$REPO:$CHANNEL-full"
          else
            MAJOR="${V%%.*}"
            MINOR="${V%.*}"
            SLIM_TAGS="$REPO:$V"$'\n'"$REPO:$MINOR"$'\n'"$REPO:$MAJOR"$'\n'"$REPO:slim"
            FULL_TAGS="$REPO:$V-full"$'\n'"$REPO:$MINOR-full"$'\n'"$REPO:$MAJOR-full"$'\n'"$REPO:full"
          fi

          {
            echo "prerelease=$PRERELEASE"
            echo "slim_tags<<TAGS_EOF"
            echo "$SLIM_TAGS"
            echo "TAGS_EOF"
            echo "full_tags<<TAGS_EOF"
            echo "$FULL_TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved version: $V (prerelease: $PRERELEASE)"
          echo "slim tags:"; echo "$SLIM_TAGS"
          echo "full tags:"; echo "$FULL_TAGS"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push slim
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bootgly/Dockerfile
          target: slim
          platforms: linux/amd64
          push: true
          build-args: |
            BOOTGLY_VERSION=${{ steps.version.outputs.value }}
            BOOTGLY_FRAMEWORK_SHA=${{ steps.source.outputs.framework_sha }}
            BOOTGLY_FRAMEWORK_DIRTY=${{ steps.source.outputs.framework_dirty }}
            BOOTGLY_FRAMEWORK_TRACKED_DIFF_SHA256=${{ steps.source.outputs.framework_tracked_diff_sha256 }}
            BOOTGLY_FRAMEWORK_UNTRACKED_MANIFEST_SHA256=${{ steps.source.outputs.framework_untracked_manifest_sha256 }}
          tags: ${{ steps.version.outputs.slim_tags }}

      - name: Build and push full
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bootgly/Dockerfile
          target: full
          platforms: linux/amd64
          push: true
          build-args: |
            BOOTGLY_VERSION=${{ steps.version.outputs.value }}
            BOOTGLY_FRAMEWORK_SHA=${{ steps.source.outputs.framework_sha }}
            BOOTGLY_FRAMEWORK_DIRTY=${{ steps.source.outputs.framework_dirty }}
            BOOTGLY_FRAMEWORK_TRACKED_DIFF_SHA256=${{ steps.source.outputs.framework_tracked_diff_sha256 }}
            BOOTGLY_FRAMEWORK_UNTRACKED_MANIFEST_SHA256=${{ steps.source.outputs.framework_untracked_manifest_sha256 }}
            BOOTGLY_BENCHMARKS_SHA=${{ steps.source.outputs.benchmarks_sha }}
            BOOTGLY_BENCHMARKS_DIRTY=${{ steps.source.outputs.benchmarks_dirty }}
            BOOTGLY_BENCHMARKS_TRACKED_DIFF_SHA256=${{ steps.source.outputs.benchmarks_tracked_diff_sha256 }}
            BOOTGLY_BENCHMARKS_UNTRACKED_MANIFEST_SHA256=${{ steps.source.outputs.benchmarks_untracked_manifest_sha256 }}
          tags: ${{ steps.version.outputs.full_tags }}

      # The bootgly_benchmarks images bake FROM the framework full image — now
      # that it is on Hub, tell that repo to rebuild every opponent against it.
      # No token configured yet → warn and stay green. To enable auto-rebuild,
      # set BENCHMARKS_DISPATCH_TOKEN on THIS repo to a fine-grained PAT whose
      # resource owner is the `bootgly` org, scoped to the `bootgly_benchmarks`
      # repository ONLY, with "Contents" repository permission set to WRITE.
      #
      # ! Contents:write, not Actions:write — POST /repos/{owner}/{repo}/dispatches
      #   is documented under the Contents permission. A token built with
      #   Actions:write authenticates and then 403s on the dispatch.
      #   https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      #
      # ! The base is the EXACT version tag, never the `full` alias. `full` only
      #   moves on a stable release, so dispatching `bootgly/bootgly:full` from a
      #   pre-release would silently build every opponent against the PREVIOUS
      #   stable framework while reporting success. `$V-full` always exists and
      #   always names the image this very run just pushed.
      - name: Trigger bootgly_benchmarks rebuild
        env:
          GH_TOKEN: ${{ secrets.BENCHMARKS_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::BENCHMARKS_DISPATCH_TOKEN not set — skipping bootgly_benchmarks dispatch."
            exit 0
          fi
          printf '{"event_type":"framework-release","client_payload":{"version":"%s","base":"bootgly/bootgly:%s-full"}}' "$VERSION" "$VERSION" > payload.json
          gh api repos/bootgly/bootgly_benchmarks/dispatches --method POST --input payload.json
