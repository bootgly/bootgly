name: Bootgly (test)

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/README.md'
  # ! A pull request runs every job; its coverage job gates the lines it changed.
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '**/README.md'
  # ! A release runs the coverage jobs only (the matrix ran on the push of the
  #   tagged commit): the tree gate on the tag, its clover attached to the release.
  release:
    types: [published]
  # ! The distro, Sury and Remi packages the container cells install move
  #   without a push: a weekly run catches that drift on its own (on the
  #   cell's job while the cell is experimental, not on the run's status).
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  # The style rules are OS- and PHP-independent (token-level checks): one job.
  lint:
    name: lint
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      -
        name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      -
        name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-file: 'development'
          ini-values: disable_functions=""
          extensions: mbstring, pcntl
      -
        name: Run Bootgly Lint command
        # Every rule bootgly.Lint.php enables, in one check-only pass over the
        # paths it configures: any unresolved issue or stale exemption fails the lane.
        run: php bootgly lint check
      -
        # ! macOS (APFS) and Windows check out case-insensitively: colliding
        #   files are refused, a file colliding with a directory is reported.
        name: Refuse case-colliding paths
        run: git ls-files | php .github/scripts/collisions.php

  # OS x PHP matrix. Two kinds of cells:
  #   runner    — PHP from setup-php on the hosted VM (x64 and arm64).
  #   container — a distro image provisioned by .github/scripts/install.sh, run
  #               with `docker run` from an ubuntu-24.04 host (not `container:`:
  #               the runner would make `tail -f /dev/null` PID 1, refuses
  #               JS actions in Alpine on arm64, and runs steps as root).
  # Both run .github/scripts/test.sh: preflight, session isolation, budget
  # and diagnostics are one script for every cell.
  test:
    name: test (${{ matrix.os }}, php ${{ matrix.php }}${{ matrix.experimental && ', experimental' || '' }})
    if: github.event_name != 'release'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # ! The Ubuntu runner cells, Debian, Fedora and the published image block
    #   (each green in three runs in a row). The others are experimental: they
    #   report but never block. Promote a cell (`experimental: false`) once the
    #   known failures noted on its row are fixed and it has a green streak.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        # ! The experimental cells (alpine-3.24, almalinux-9, macos-15) are
        #   paused while another session fixes them: uncomment each one here
        #   and its `include` entry below to bring it back.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - debian-13
          # - alpine-3.24
          - fedora-44
          # - almalinux-9
          - docker-image
          # - macos-15
        php: ['8.4', '8.5']
        # ! ./Dockerfile does not build on PHP 8.5 (`docker-php-ext-install
        #   opcache` exits 2: OPcache is built into 8.5), and the published
        #   image ships 8.4 only. Add the cell back with that Dockerfile fix.
        exclude:
          - os: docker-image
            php: '8.5'
        include:
          # # Runner cells (coverage: the Xdebug state; preflight asserts it)
          # ! 8.5 keeps 900s until a runner run is timed (519s locally,
          #   without Xdebug).
          - os: ubuntu-24.04
            kind: runner
            runner: ubuntu-24.04
            coverage: none
            budget: 900
            experimental: false
          # ! The required lane: the original job, Xdebug in coverage mode
          #   included (what setup-php leaves on there by default), so the
          #   XDebug branch of 7.1.2-Coverage-detect_xdebug_mode_guard keeps
          #   running. 900s: its first matrix run took 582s of the original
          #   600s (504s green, 506s at 9b2b958f) — too close to tell a stall.
          - os: ubuntu-24.04
            php: '8.4'
            coverage: xdebug
            budget: 900
            experimental: false
          # ! arm64 is a shipped target (the image is multi-arch), but these
          #   cells cannot be reproduced on an x86_64 host.
          - os: ubuntu-24.04-arm
            kind: runner
            runner: ubuntu-24.04-arm
            coverage: none
            budget: 900
            experimental: false
          # ! setup-php supports this image only since 2.40.0, and its VM
          #   kernel (7.0) is not reproduced locally.
          - os: ubuntu-26.04
            kind: runner
            runner: ubuntu-26.04
            coverage: none
            budget: 900
            experimental: false
          # ! Darwin (arm64, APFS case-insensitive, BSD userland, no procfs):
          #   the macOS port's proving ground. Expected red until the port
          #   lands: the /proc-only specs fail, instance discovery needs a
          #   procfs-free proof, and SO_REUSEPORT does not balance. 1800s:
          #   3 vCPU and no timed run yet.
          # - os: macos-15
          #   kind: runner
          #   runner: macos-15
          #   coverage: none
          #   budget: 1800
          #   experimental: true
          # # Container cells (image: the cell's base; mirrors avoid Docker Hub's anonymous pull limit)
          # ! docker-init is PID 1: the suite takes its non-systemd branches.
          - os: debian-13            # glibc · deb · 8.4 native, 8.5 deb.sury.org
            kind: container
            runner: ubuntu-24.04
            image: public.ecr.aws/docker/library/debian:13
            budget: 900
            experimental: false
          # ! musl and BusyBox: no GLOB_BRACE, its own strerror() wording, a
          #   setlocale() that accepts any name, BusyBox find and ls — the
          #   suite and the global wrapper keep to what all of them share.
          #   Still experimental: one green run, and WS_Client 5.6
          #   (pong_coalescing, lock-step under backpressure) has flaked once.
          # - os: alpine-3.24          # musl · BusyBox · apk · 8.4 and 8.5 native
          #   kind: container
          #   runner: ubuntu-24.04
          #   image: public.ecr.aws/docker/library/alpine:3.24
          #   budget: 900
          #   experimental: true
          - os: fedora-44            # glibc · rpm · 8.5 native, 8.4 Remi
            kind: container
            runner: ubuntu-24.04
            image: quay.io/fedora/fedora:44
            budget: 900
            experimental: false
          # ! glibc 2.34 (the oldest userland) · EL · Remi. Its libedit
          #   (20210216) keeps a ^V read blocked through SIGCHLD, so the
          #   console prompt's supervision stalls there. The image also ships
          #   journalctl without a running journald (9.6-syslog-handler).
          # - os: almalinux-9
          #   kind: container
          #   runner: ubuntu-24.04
          #   image: public.ecr.aws/docker/library/almalinux:9
          #   budget: 900
          #   experimental: true
          # ! The published image's runtime: ./Dockerfile `base` stage. It is
          #   the only cell on GNU readline (the php images build ext-readline
          #   against it) and on the tracing JIT (its own zz-bootgly.ini). It
          #   loads no php.ini: PHP's built-in defaults plus the CI drop-in
          #   (short_open_tag On, variables_order EGPCS).
          - os: docker-image
            kind: container
            runner: ubuntu-24.04
            image: bootgly-matrix-base
            budget: 900
            experimental: false

    steps:
      -
        name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # # Runner cells
      -
        name: Set up PHP
        if: matrix.kind == 'runner'
        uses: shivammathur/setup-php@v2
        env:
          # ! ubuntu-26.04 ships a distro PHP 8.5.4: without `update` setup-php
          #   keeps that patch level instead of the current 8.5 release.
          update: ${{ matrix.os == 'ubuntu-26.04' }}
        with:
          php-version: ${{ matrix.php }}
          ini-file: 'development'
          ini-values: disable_functions=""
          # ! The baseline .github/scripts/preflight.php asserts, all built in
          #   or installed by default. setup-php installs what the image
          #   lacks but does not fail on a miss: preflight fails the cell.
          extensions: mbstring, pcntl, posix, sockets, readline, session, sqlite3, fileinfo, ctype, iconv, tokenizer, zlib, sysvsem, sysvshm, simplexml, openssl
          # ! Xdebug is set per cell, not left to the image (setup-php's PHP
          #   loads it in coverage mode unless told `none`).
          coverage: ${{ matrix.coverage }}
      -
        # ! macOS has no util-linux setsid nor GNU timeout: test.sh calls
        #   Homebrew's (keg-only setsid, gtimeout) by absolute path, so the
        #   suite itself still runs on the BSD userland a Mac user has.
        name: Install the session tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: brew install util-linux coreutils
      -
        # ! The tree tracks the launcher `bootgly` beside the framework's
        #   `Bootgly/`: a case-insensitive APFS checkout keeps only one of
        #   them (`php bootgly` then cannot find Bootgly/autoboot.php). Until
        #   the names stop colliding, the cell clones the checked-out commit
        #   onto a case-sensitive APFS volume — what a Mac user needs today —
        #   and runs the suite there.
        name: Check out on a case-sensitive volume (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -quiet -size 4g -type SPARSE -fs 'Case-sensitive APFS' -volname bootgly "$RUNNER_TEMP/bootgly.sparseimage"
          hdiutil attach -quiet -nobrowse -mountpoint /Volumes/bootgly "$RUNNER_TEMP/bootgly.sparseimage"
          git -c protocol.file.allow=always clone --quiet --depth 1 "file://$GITHUB_WORKSPACE" /Volumes/bootgly/bootgly
      -
        name: Run Bootgly Test command
        if: matrix.kind == 'runner'
        working-directory: ${{ runner.os == 'macOS' && '/Volumes/bootgly/bootgly' || github.workspace }}
        env:
          BOOTGLY_TEST_TRACE: 1
          BOOTGLY_CI_BUDGET: ${{ matrix.budget }}
          BOOTGLY_CI_PHP: ${{ matrix.php }}
          BOOTGLY_CI_XDEBUG: ${{ matrix.coverage == 'xdebug' && '1' || '0' }}
        run: bash .github/scripts/test.sh

      # # Container cells
      -
        name: Build the cell image
        if: matrix.kind == 'container'
        env:
          CELL_OS: ${{ matrix.os }}
          CELL_PHP: ${{ matrix.php }}
          CELL_BASE: ${{ matrix.image }}
        run: |
          # ! Public registries throttle the runners' shared addresses (ECR
          #   answered 429 to every cell, for minutes): pull each base with a
          #   growing, jittered pause, falling back to Google's and Docker's
          #   copies of the same library image. The builds use the local copy.
          fetch () {
            local sources=("$1") source attempt
            case "$1" in
              public.ecr.aws/docker/library/*)
                sources+=("mirror.gcr.io/library/${1#public.ecr.aws/docker/library/}")
                sources+=("docker.io/library/${1#public.ecr.aws/docker/library/}")
                ;;
            esac
            for attempt in 1 2 3; do
              for source in "${sources[@]}"; do
                if docker pull --quiet "$source" >&2; then
                  echo "$source"
                  return 0
                fi
              done
              if [ "$attempt" -lt 3 ]; then
                sleep $(( attempt * 30 + RANDOM % 30 ))
              fi
            done
            echo "::error::cannot pull $1 from any registry" >&2
            return 1
          }
          # ! install.sh's own network steps retry; a build that still fails
          #   gets one more pass after a pause.
          retry () {
            "$@" && return 0
            sleep $(( 30 + RANDOM % 30 ))
            "$@"
          }
          if [ "$CELL_OS" = docker-image ]; then
            # The PHP runtime bootgly/bootgly ships, built as the release does.
            PHP_IMAGE=$(fetch "public.ecr.aws/docker/library/php:${CELL_PHP}-cli-bookworm")
            retry docker build --target base \
              --build-arg PHP_IMAGE="$PHP_IMAGE" \
              --tag bootgly-matrix-base .
          else
            BASE=$(fetch "$CELL_BASE")
            docker tag "$BASE" bootgly-matrix-base
          fi
          retry docker build --file .github/scripts/cell.Dockerfile \
            --build-arg BASE=bootgly-matrix-base \
            --build-arg DISTRO="$CELL_OS" \
            --build-arg PHP="$CELL_PHP" \
            --build-arg CI_UID="$(id -u)" \
            --build-arg CI_GID="$(id -g)" \
            --tag bootgly-matrix-cell .github/scripts
      -
        name: Run Bootgly Test command
        if: matrix.kind == 'container'
        env:
          BOOTGLY_TEST_TRACE: 1
          BOOTGLY_CI_BUDGET: ${{ matrix.budget }}
          BOOTGLY_CI_PHP: ${{ matrix.php }}
        # ! --init: docker-init is PID 1 and reaps orphans (TEST-11).
        #   --user: the runner's uid/gid, so the suite runs unprivileged and
        #   owns the bind-mounted checkout. The rest gives the container what
        #   the runner VM has: IPv6 loopback and the VM's open-file limit.
        #   The checkout keeps the runner's short workspace path: the unix
        #   sockets the suite binds under storage/pids/ must fit in sun_path
        #   (108 bytes), and a deep mount silently truncates them.
        #   GITHUB_ACTIONS stays out on purpose: the suite takes a user's
        #   paths here (a Foreground server master that stops exits instead
        #   of returning), the runner cells take the CI ones.
        run: |
          docker run --rm --init --name bootgly-matrix-cell \
            --user "$(id -u):$(id -g)" \
            --sysctl net.ipv6.conf.lo.disable_ipv6=0 \
            --ulimit nofile=65536:65536 \
            --env BOOTGLY_TEST_TRACE --env BOOTGLY_CI_BUDGET --env BOOTGLY_CI_PHP \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            bootgly-matrix-cell bash .github/scripts/test.sh
      -
        name: Dump the kernel log
        if: failure() && matrix.kind == 'container'
        run: sudo dmesg -T 2>/dev/null | tail -40 || true
      -
        # ! A PHP child that dies by SIGSEGV/SIGABRT on Darwin (fork safety,
        #   PCRE JIT) leaves an .ips report, not a kernel-log line.
        name: Dump crash reports (macOS)
        if: failure() && runner.os == 'macOS'
        run: |
          find ~/Library/Logs/DiagnosticReports -name 'php*' -mmin -60 2>/dev/null | head -3 | while read -r report; do
            echo "===== $report"
            head -80 "$report" || true
          done

      # # Every cell
      -
        name: Dump benchmark run artifacts
        if: failure()
        working-directory: ${{ runner.os == 'macOS' && '/Volumes/bootgly/bootgly' || github.workspace }}
        run: |
          find storage/tests/benchmarks -type f 2>/dev/null | while read -r file; do
            echo "===== $file"
            cat -v "$file" || true
            echo
          done
      -
        name: Remove the cell container
        if: always() && matrix.kind == 'container'
        run: docker rm -f bootgly-matrix-cell >/dev/null 2>&1 || true

  # The coverage gate: the whole suite under PCOV, measured over every PHP
  # source in Bootgly/ (files no test loads count at zero). Not on the weekly
  # schedule: that run watches distro drift, which does not move coverage.
  #   push to main  — the statements floor over the tree; clover as an artifact.
  #   pull request  — the same floor over the lines the pull request changed,
  #                   and no changed class left without a covered statement.
  #   release       — the tree gate on the tag; its clover is attached to the
  #                   release as bootgly-<tag>-coverage.clover.xml.
  coverage:
    name: coverage (pcov, php 8.4)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # ! A newer pull-request push cancels the older gate; every other run is
    #   its own group, so a push to main is never cancelled while pending.
    concurrency:
      group: coverage-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # ! The statements floor (percent of executable statements in Bootgly/).
      #   Baseline over the 1.2.0 tree (these flags run locally on PHP 8.5):
      #   69.8% of 69,266 statements; the floor sits below it to absorb
      #   PHP-version and run-to-run drift. Raise it as coverage grows; never
      #   lower it to let a change through.
      #   What PCOV cannot see counts as uncovered: lines that run before the
      #   runner starts collecting (CLI boot, the runner's own prologue and
      #   epilogue), forked server workers and sub-processes. A pull request
      #   that only changes such code fails its gate however it is tested.
      #   The tree is not gated on classes yet: 66 class sources were at zero in
      #   that baseline — worker- and sub-process-only code, untested classes,
      #   and constant-only traits/enums whose one statement runs at load, before
      #   collection starts. Pull requests are gated on it now.
      BOOTGLY_COVERAGE_FLOOR: '65'

    steps:
      -
        # ! Full history: a pull request diffs against its base branch, and the
        #   runner's git-dependent specs skip on a shallow clone.
        name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-file: 'development'
          # ! pcov.enabled=1: a PCOV that is loaded but disabled stops the run
          #   (it would measure nothing). The directory is the checkout, so
          #   every source under Bootgly/ is instrumented.
          ini-values: disable_functions="", pcov.enabled=1, pcov.directory=${{ github.workspace }}
          extensions: mbstring, pcntl, posix, sockets, readline, session, sqlite3, fileinfo, ctype, iconv, tokenizer, zlib, sysvsem, sysvshm, simplexml, openssl
          coverage: pcov
      -
        name: Run Bootgly Test command under coverage
        env:
          BOOTGLY_TEST_TRACE: 1
          # ! The Xdebug lane takes ~10 minutes; collection adds to it.
          BOOTGLY_CI_BUDGET: 1500
          BOOTGLY_CI_PHP: '8.4'
          BOOTGLY_CI_XDEBUG: 0
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -- --coverage --coverage-driver=pcov --coverage-path=Bootgly/ \
             --coverage-floor="$BOOTGLY_COVERAGE_FLOOR" \
             --coverage-report=clover:"$RUNNER_TEMP/coverage.xml"
          # ? A pull request is gated on the lines it changed; the checkout is
          #   its merge commit, so the range ends at the measured tree
          if [ "$EVENT" = pull_request ]; then
             set -- "$@" --coverage-diff="origin/$BASE...HEAD" --coverage-classes
          fi
          bash .github/scripts/test.sh "$@"
      -
        name: Upload the clover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: ${{ runner.temp }}/coverage.xml
          if-no-files-found: warn
          retention-days: 30
          # ? A re-run of a failed attempt replaces its report
          overwrite: true

  # Only a report whose run passed — every suite and the gate — reaches the
  # release; this job alone can write, and it runs none of the tested code.
  publish:
    name: attach the clover report to the release
    needs: coverage
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      -
        name: Download the clover report
        uses: actions/download-artifact@v4
        with:
          name: coverage-clover
          path: coverage
      -
        name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # ? A tag may hold `/`; an asset name cannot
          asset="bootgly-${TAG//\//-}-coverage.clover.xml"
          mv coverage/coverage.xml "$asset"
          gh release upload "$TAG" "$asset" --clobber --repo "$REPOSITORY"
