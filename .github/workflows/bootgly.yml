name: Bootgly (test)

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/README.md'

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      -
        name: Checkout code
        uses: actions/checkout@v5

      -
        name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-file: 'development'
          ini-values: disable_functions=""
          extensions: mbstring, pcntl
      -
        name: Run Bootgly Test command
        env:
          BOOTGLY_TEST_TRACE: 1
        run: |
          php bootgly
          set +e
          started=$SECONDS
          # The run gets its own session, so a process-group signal raised inside
          # it cannot reach this shell: the step reports the run instead of dying
          # with it. setsid does not relay a signal death (it returns the bare
          # signal number), so the inner shell records the real status itself; a
          # missing file means the run's own shell was killed under it.
          STATUS="$RUNNER_TEMP/bootgly-test.status"
          rm -f "$STATUS"
          STATUS="$STATUS" setsid --wait bash -c \
            'timeout --signal=TERM --kill-after=30 600 php bootgly test --bootgly; echo $? > "$STATUS"'
          code=$(cat "$STATUS" 2>/dev/null)
          if [ -z "$code" ]; then
            echo '::error::the run session was killed from the outside — no status recorded'
            code=137
          fi
          elapsed=$(( SECONDS - started ))
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::bootgly test exited ${code} after ${elapsed}s"
            if [ "$code" -eq 124 ]; then
              echo '::error::the 600s budget expired — the run stalled'
            elif [ "$code" -gt 128 ]; then
              echo "::error::killed by signal $(( code - 128 )) — not the budget"
            fi
            ps auxf || true
            ss -tlnp || true
            free -m || true
            sudo dmesg -T 2>/dev/null | tail -80 || true
          fi
          exit "$code"
      -
        name: Dump benchmark run artifacts
        if: failure()
        run: |
          find storage/tests/benchmarks -type f 2>/dev/null | while read -r file; do
            echo "===== $file"
            cat -v "$file" || true
            echo
          done